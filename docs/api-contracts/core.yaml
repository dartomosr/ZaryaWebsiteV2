          type: string
          enum:
          - visible
          - hidden
          - author_removed
        hiddenAt:
          oneOf:
          - type: string
            format: date-time
          - type: object
            nullable: true
            enum:
            - null
        hiddenReason:
          oneOf:
          - type: string
          - type: object
            nullable: true
            enum:
            - null
      required:
      - comment
      - moderationStatus
      - hiddenAt
      - hiddenReason
      description: Если автор стёр текст через удаление аккаунта, возвращать старое содержимое запрещено.
    ModerationCommentPage:
