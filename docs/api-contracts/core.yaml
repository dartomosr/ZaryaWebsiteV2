openapi: 3.0.3
info:
  title: 'ZaryaWebsite API — Зона 2: основной функционал'
  version: 0.1.0
  description: Пока содержит только известный предварительный контракт публичного списка новостей из frontend/MSW.
    Остальные ресурсы появятся после проектирования зоны 2.
servers:
- url: /
tags:
- name: News
paths:
  /api/news:
    get:
      tags:
      - News
      operationId: listPublicNews
      x-contract-zone: core
      summary: Список опубликованных новостей с бинарными обложками
      description: 'Ответ multipart/mixed: первая часть содержит JSON-метаданные, следующие части содержат бинарные
        изображения. Content-ID обложки связывает бинарную часть с карточкой. Контракт предварительный, backend не подтверждал.'
      security: []
      parameters:
      - $ref: ./common.yaml#/components/parameters/Page
      - $ref: ./common.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: >-
            Успешно. Сырой multipart-поток: первая часть Content-ID <metadata>, application/json с моделью NewsPage;
            каждая следующая часть содержит байты изображения и Content-ID, совпадающий с coverPartId.
            Допустимые типы частей изображений: image/jpeg, image/png и image/webp. Если обложек нет, передаётся
            только часть metadata.
          content:
            multipart/mixed:
              schema:
                type: string
                format: binary
        '400':
          $ref: ./common.yaml#/components/responses/Error400
        '429':
          $ref: ./common.yaml#/components/responses/Error429
        '500':
          $ref: ./common.yaml#/components/responses/Error500
        '503':
          $ref: ./common.yaml#/components/responses/Error503
components: {}
x-contract-zone: core
x-stability: proposed-msw-only
