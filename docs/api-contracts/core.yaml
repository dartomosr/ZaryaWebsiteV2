components:
  schemas:
    PublishedNews:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        bodyMarkdown:
          type: string
          minLength: 1
        coverUrl:
          oneOf:
          - type: string
            format: uri
          - type: object
            nullable: true
            enum:
            - null
        publishedAt:
          type: string
          format: date-time
        editedAt:
          oneOf:
          - type: string
            format: date-time
          - type: object
            nullable: true
            enum:
            - null
        commentsEnabled:
          type: boolean
      required:
      - id
      - title
      - summary
      - bodyMarkdown
      - coverUrl
      - publishedAt
      - editedAt
      - commentsEnabled
      description: Опубликованный снимок. Черновики и корзина гостю недоступны.
    UpdateSections:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        newFeatures:
          type: string
          minLength: 1
          maxLength: 30000
        changes:
          type: string
          minLength: 1
          maxLength: 30000
        fixes:
          type: string
          minLength: 1
          maxLength: 30000
        balance:
          type: string
          minLength: 1
          maxLength: 30000
      description: Ключи фиксированы, отображаются только непустые в порядке Нововведения, Изменения,
        Исправления, Баланс.
      x-display-order:
      - newFeatures
      - changes
      - fixes
      - balance
    PublishedUpdate:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        releaseDate:
          oneOf:
          - type: string
            format: date
          - type: object
            nullable: true
            enum:
            - null
        sections:
          $ref: '#/components/schemas/UpdateSections'
        coverUrl:
          oneOf:
          - type: string
            format: uri
          - type: object
            nullable: true
            enum:
            - null
        publishedAt:
          type: string
          format: date-time
        editedAt:
          oneOf:
          - type: string
            format: date-time
          - type: object
            nullable: true
            enum:
            - null
        commentsEnabled:
          type: boolean
      required:
      - id
      - version
      - title
      - summary
      - releaseDate
      - sections
      - coverUrl
      - publishedAt
      - editedAt
      - commentsEnabled
    UpdateCard:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        coverUrl:
          oneOf:
          - type: string
            format: uri
          - type: object
            nullable: true
            enum:
            - null
        publishedAt:
          type: string
          format: date-time
      required:
      - id
      - version
      - title
      - summary
      - coverUrl
      - publishedAt
    UpdatesPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpdateCard'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
        nextPage:
          type: integer
          minimum: 1
          nullable: true
      required:
      - items
      - page
      - pageSize
      - nextPage
    PublicAuthor:
      type: object
      additionalProperties: false
      properties:
        id:
          oneOf:
          - type: string
            minLength: 1
          - type: object
            nullable: true
            enum:
            - null
        displayName:
          type: string
          minLength: 1
        avatarUrl:
          oneOf:
          - type: string
            format: uri
          - type: object
            nullable: true
            enum:
            - null
        deleted:
          type: boolean
      required:
      - id
      - displayName
      - avatarUrl
      - deleted
      description: Никаких email, username, ссылок на публичный профиль.
    Comment:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        materialType:
          type: string
          enum:
          - news
          - update
        materialId:
          type: string
          minLength: 1
        rootId:
          oneOf:
          - type: string
            minLength: 1
          - type: object
            nullable: true
            enum:
            - null
        replyToCommentId:
          oneOf:
          - type: string
            minLength: 1
          - type: object
            nullable: true
            enum:
            - null
        author:
          $ref: '#/components/schemas/PublicAuthor'
        text:
          oneOf:
          - type: string
          - type: object
            nullable: true
            enum:
            - null
        createdAt:
          type: string
          format: date-time
        editedAt:
          oneOf:
          - type: string
            format: date-time
          - type: object
            nullable: true
            enum:
            - null
        isPlaceholder:
          type: boolean
        repliesCount:
          type: integer
          minimum: 0
      required:
      - id
      - materialType
      - materialId
      - rootId
      - replyToCommentId
      - author
      - text
      - createdAt
      - editedAt
      - isPlaceholder
      - repliesCount
      description: Корневой комментарий rootId=null; ответ rootId=id корня, даже если отвечает на другой
        ответ. После удаления текст=null и заполнитель при наличии ответов.
    CommentPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
        nextPage:
          type: integer
          minimum: 1
          nullable: true
      required:
      - items
      - page
      - pageSize
      - nextPage
      description: Для ленты материалов содержит только корневые комментарии; GET /api/comments/{rootId}/replies
        — ответы.
    NewComment:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
        rootId:
          oneOf:
          - type: string
            minLength: 1
          - type: object
            nullable: true
            enum:
            - null
        replyToCommentId:
          oneOf:
          - type: string
            minLength: 1
          - type: object
            nullable: true
            enum:
            - null
      required:
      - text
      - rootId
      - replyToCommentId
      description: Для корня оба null. Для ответа rootId=id корневого комментария, replyToCommentId=id
        адресата в той же ветке. Проверяется сервером.
      oneOf:
      - properties:
          rootId:
            type: object
            nullable: true
            enum:
            - null
          replyToCommentId:
            type: object
            nullable: true
            enum:
            - null
      - properties:
          rootId:
            type: string
            minLength: 1
          replyToCommentId:
            type: string
            minLength: 1
    EditComment:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
      required:
      - text
    ReactionType:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        iconKey:
          type: string
          minLength: 1
      required:
      - id
      - label
      - iconKey
      description: iconKey для фирменного frontend-ассета; набор реакций пока не утверждён, не выдумывать
        конкретные значения.
    ReactionCatalog:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReactionType'
      required:
      - items
    ReactionCounts:
      type: object
      additionalProperties: false
      properties:
        counts:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              typeId:
                type: string
                minLength: 1
              count:
                type: integer
                minimum: 0
            required:
            - typeId
            - count
        myReactionTypeId:
          oneOf:
          - type: string
            minLength: 1
          - type: object
            nullable: true
            enum:
            - null
      required:
      - counts
      - myReactionTypeId
      description: Гостю myReactionTypeId=null. Одна реакция пользователя на одну новость.
    SetReaction:
      type: object
      additionalProperties: false
      properties:
        typeId:
          type: string
          minLength: 1
      required:
      - typeId
    ModerationComment:
      type: object
      additionalProperties: false
      properties:
        comment:
          $ref: '#/components/schemas/Comment'
