<html lang="ru">
<head>

  <title>ZaryaWebsite — интерактивный просмотр API 0.1</title>
  <style>
    :root {font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#e7ecf7;background:#0e111b; --panel:#171c2a;--panel2:#111725;--edge:#2d3649;--muted:#9faac0;--orange:#ffb45d;--yellow:#ffe2a1;--accent:#8c73e7;--code:#101521;--blue:#79c2fd;--teal:#76e5cf;--rose:#ffa2b5; --active:#262d40;}
    *{box-sizing:border-box} html{scroll-behavior:smooth}body{margin:0;min-height:100vh} button,input,a{font:inherit}button{cursor:pointer}a{color:var(--orange);text-decoration:none}a:hover{text-decoration:underline}
    .app{display:grid;grid-template-columns:312px minmax(0,1fr);min-height:100vh}
    aside{height:100vh;position:sticky;top:0;display:flex;flex-direction:column;border-right:1px solid var(--edge);background:#121725;min-width:0}
    .brand{display:flex;align-items:center;gap:12px;padding:23px 20px 16px;border-bottom:1px solid var(--edge)}
    .logo{height:39px;width:39px;border-radius:12px;background:linear-gradient(145deg,#ffce70,#fe785c 65%,#9c5dbe);display:grid;place-items:center;color:#18101c;font-weight:950;letter-spacing:-1px;font-size:20px;box-shadow:0 7px 23px #f5844d22}
    .brand-title{font-weight:800;font-size:16px;letter-spacing:.03em}.brand-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .search-area{padding:18px 17px 12px}.searchbox{display:flex;align-items:center;gap:8px;background:#0c111e;border:1px solid var(--edge);border-radius:10px;padding:0 11px}.searchbox:focus-within{border-color:var(--accent)}
    .searchbox span{color:#7e8ca5}.searchbox input{min-width:0;flex:1;background:transparent;border:0;outline:none;color:white;padding:11px 0;font-size:13px}.searchbox input::placeholder{color:#74819b}.kbd{font-size:10px;color:#95a0b5;border:1px solid #394156;border-radius:5px;padding:2px 5px}
    .filters{display:flex;gap:6px;padding:0 17px 17px;flex-wrap:wrap}.filter{font-size:12px;background:#192033;color:#b7c1d3;border:1px solid #303950;border-radius:7px;padding:6px 9px}.filter.selected{border-color:#ffae62;background:#513326;color:#ffe0b4}.filter:focus-visible,button:focus-visible{outline:2px solid #e4b1ff;outline-offset:2px}
    .navscroll{overflow:auto;flex:1;padding:0 9px 25px}.navgroup{padding:12px 10px 5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8b97ad;font-weight:800;display:flex;justify-content:space-between}.navgroup small{letter-spacing:normal;font-size:11px;color:#69758f}
    .navitem{width:100%;color:#c6d1e5;border:0;border-radius:8px;padding:9px 9px;display:flex;align-items:center;gap:10px;text-align:left;background:none;margin:2px 0;transition:background .15s}
    .navitem:hover{background:#222a3b}.navitem.selected{background:#2d3044;color:#fff}.navitem .nvname{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
    .method{font-family:ui-monospace,Consolas,monospace;font-size:10px;border-radius:5px;font-weight:800;min-width:49px;display:inline-block;text-align:center;padding:5px 4px}
    .get{color:#84c6ff;background:#183c56}.post{color:#8cf2d8;background:#164239}.patch{color:#ffcd82;background:#523c1f}.put{color:#d5baff;background:#41305a}.delete{color:#ffabb4;background:#4c2638}
    .foot{border-top:1px solid var(--edge);padding:12px 18px;color:#8390a6;font-size:11px;line-height:1.6}
    main{min-width:0;padding:0 36px 90px}.mainwrap{max-width:1070px;margin:auto}
    .topbar{min-height:78px;display:flex;align-items:center;gap:14px;justify-content:space-between;border-bottom:1px solid var(--edge)}.crumb{font-size:12px;color:#a1acc0}.pill{border:1px solid #775b43;color:#facb93;background:#362820;border-radius:30px;font-size:11px;font-weight:700;padding:7px 12px;white-space:nowrap}
    .hero{padding:46px 0 25px}.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.13em;color:var(--orange);margin-bottom:10px}h1{font-size:clamp(30px,4vw,46px);line-height:1.11;letter-spacing:-.035em;margin:0 0 14px}h2{font-size:24px;letter-spacing:-.025em;margin:0 0 10px}h3{font-size:16px;margin:0 0 10px}p{color:#b4bfd0;line-height:1.65;margin:8px 0 14px}strong{color:#eef3ff}
    .hero p{max-width:750px;font-size:15px}.accent{color:var(--yellow)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0 25px}.stat{border:1px solid var(--edge);background:linear-gradient(150deg,#1d2536,#151a28);padding:19px;border-radius:14px;min-height:122px}.stat .number{font-size:33px;letter-spacing:-.03em;font-weight:800;margin:4px 0}.stat .name{color:#ccd5e4;font-weight:800;font-size:13px}.stat .cap{font-size:12px;color:#8997ab;line-height:1.5;margin-top:5px}
    .callout{background:#27231f;border:1px solid #6d5436;border-radius:12px;padding:16px 19px;color:#ffd8a4;font-size:13px;line-height:1.6;margin:18px 0 27px}.callout strong{color:#ffeac4}
    .introgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid var(--edge);border-radius:14px;background:var(--panel);padding:22px}.panel ul{margin:12px 0;padding-left:20px;color:#bac5d8;font-size:14px;line-height:1.9}.panel li::marker{color:var(--orange)}
    .action{display:inline-flex;align-items:center;gap:6px;border-radius:9px;background:#392e31;color:#ffe0b9;border:1px solid #846040;font-weight:700;font-size:12px;padding:9px 13px}.action:hover{background:#48352e;text-decoration:none}
    .sectionline{height:1px;background:var(--edge);margin:30px 0}

    .meta{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.tag{border:1px solid #384359;background:#1c2536;border-radius:20px;padding:5px 10px;font-size:11px;color:#bdc9df}.tag.zone{border-color:#70533b;background:#3b2b22;color:#ffcf91}.tag.source{border-color:#495679;background:#20263b;color:#aebde7}
    .tabs{display:flex;border-bottom:1px solid var(--edge);gap:6px;margin:24px 0 22px;flex-wrap:wrap}.tab{border:0;background:none;color:#99a6bb;font-weight:700;font-size:13px;padding:10px 14px 12px;border-bottom:2px solid transparent}.tab.on{color:var(--yellow);border-bottom-color:#ffab61}.tab:hover{color:white}
    .block{margin:25px 0}.blocktitle{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#adbbd2;font-weight:800;margin:0 0 12px}.empty{font-size:13px;color:#8896aa;padding:15px;border:1px dashed #354057;border-radius:10px}

    .schema-name{font-size:12px;color:#c8a9f4;font-weight:700;margin:11px 0 8px;overflow-wrap:anywhere}.schema-tip{color:#8c9ab1;font-size:12px;margin:7px 0}.schema-raw{margin-top:8px}.schema-raw summary{font-size:12px;color:#9fabbe;cursor:pointer}pre{background:#0c1320;border:1px solid #303d57;padding:15px;border-radius:9px;white-space:pre-wrap;overflow-wrap:anywhere;color:#b9e5cf;font-size:12px;line-height:1.5;max-height:420px;overflow:auto}
    .flowcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.flowcard{border:1px solid #38455d;background:#1a2234;border-radius:12px;padding:16px;cursor:pointer;text-align:left;color:#c9d4e7}.flowcard:hover{border-color:#ffb45d}.flowcard b{display:block;color:#fae1ba;margin-bottom:7px;font-size:13px}.flowcard small{display:block;line-height:1.6;font-size:12px;color:#8fa0b9}

    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

<script>
'use strict';
const spec=JSON.parse(document.getElementById('api-data').textContent);
const names={foundation:'Фундаментальный',core:'Основной',extended:'Расширенный'};
const tagNames={Auth:'Авторизация и сессии',Email:'Подтверждение почты',TwoFactor:'Двухфакторная защита',Recovery:'Восстановление пароля',OwnerRecovery:'Аварийный доступ владельца',Profile:'Профиль и настройки',AdminUsers:'Управление пользователями',Owner:'Передача владельца',News:'Новости'};
const tagOrder=['Auth','Email','TwoFactor','Recovery','OwnerRecovery','Profile','AdminUsers','Owner','News'];
const opList=[];
for(const [path, item] of Object.entries(spec.paths))for(const [verb,op] of Object.entries(item)){if(!['get','post','put','patch','delete'].includes(verb))continue;opList.push({id:op.operationId,path,verb,op,zone:op['x-contract-zone']||'core',tag:op.tags?.[0]||'Other'});}
let active='overview',zone='all',search='';
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const $=s=>document.querySelector(s);
function resolver(ref){if(!ref || !ref.startsWith('#/'))return null;let p=ref.slice(2).split('/').map(x=>x.replace(/~1/g,'/').replace(/~0/g,'~'));let obj=spec;for(const q of p)obj=obj?.[q];return obj||null;}
function deref(obj,depth=0){if(!obj||depth>7)return obj;if(obj.$ref){const next=resolver(obj.$ref);return next?deref(next,depth+1):obj;}return obj;}
function refName(obj){if(!obj?.$ref)return null;return obj.$ref.split('/').pop();}
function typeOf(s){if(!s)return '—';const n=refName(s);if(n)return n;const a=deref(s);if(a.oneOf)return a.oneOf.map(typeOf).join(' | ');if(a.anyOf)return a.anyOf.map(typeOf).join(' | ');if(a.type==='array')return 'массив<'+typeOf(a.items)+'>';return Array.isArray(a.type)?a.type.join(' | '):(a.type|| (a.properties?'object':a.enum?'enum':'object'));}
function constraint(s){const a=deref(s);if(!a)return '';let str=[];if(a.format)str.push(a.format);if(a.enum)str.push('значения: '+a.enum.join(' / '));if(a.minLength!=null)str.push('мин. '+a.minLength+' симв.');if(a.maxLength!=null)str.push('макс. '+a.maxLength+' симв.');if(a.minimum!=null)str.push('от '+a.minimum);if(a.maximum!=null)str.push('до '+a.maximum);return str.join('; ')}
function schemaTable(raw){if(!raw)return '<div class="empty">Тело отсутствует</div>';const a=deref(raw);let title=refName(raw);let topTitle=title?'<div class="schema-name">Схема: '+esc(title)+'</div>':'';
if(a?.oneOf||a?.anyOf){const group=a.oneOf||a.anyOf;return topTitle+'<div class="schema-tip">Один из вариантов ответа:</div>'+group.map((x,i)=>'<details class="schema-raw" '+(i===0?'open':'')+'><summary>Вариант '+(i+1)+' — '+esc(typeOf(x))+'</summary>'+schemaTable(x)+'</details>').join('')}
if(a?.type==='array'){return topTitle+'<div class="schema-tip">Массив элементов '+esc(typeOf(a.items))+'</div>'+schemaTable(a.items)}
if(!a?.properties){return topTitle+'<div class="schema-tip">Тип: <strong>'+esc(typeOf(raw))+'</strong> '+esc(constraint(raw))+'</div>'+rawSchema(raw)}
const required=new Set(a.required||[]);let rows='';for(const [key,val] of Object.entries(a.properties)){const req=required.has(key);rows+='<tr><td><code>'+esc(key)+'</code>'+(req?'<span class="small required">обязательно</span>':'<span class="small">необязательно</span>')+'</td><td><code>'+esc(typeOf(val))+'</code></td><td>'+esc(deref(val)?.description||val.description||'—')+(constraint(val)?'<span class="small">'+esc(constraint(val))+'</span>':'')+'</td></tr>'}
return topTitle+'<div class="tablewrap"><table><thead><tr><th>Поле</th><th>Тип</th><th>Описание / ограничения</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+rawSchema(raw);
}
function rawSchema(raw){return '<details class="schema-raw"><summary>Показать оригинальную JSON-схему</summary><pre>'+esc(JSON.stringify(deref(raw),null,2))+'</pre></details>'}
function parameters(op){const pars=(op.parameters||[]).map(deref);if(!pars.length)return '<div class="empty">Параметров пути и заголовков в этом методе нет.</div>';return '<div class="tablewrap"><table><thead><tr><th>Параметр</th><th>Где</th><th>Тип</th><th>Описание</th></tr></thead><tbody>'+pars.map(p=>'<tr><td><code>'+esc(p.name)+'</code>'+(p.required?'<span class="small required">обязательно</span>':'')+'</td><td>'+esc(p.in)+'</td><td><code>'+esc(typeOf(p.schema))+'</code></td><td>'+esc(p.description||'—')+'</td></tr>').join('')+'</tbody></table></div>'}
function requestBody(op){const body=deref(op.requestBody);if(!body)return '<div class="empty">Тело запроса не требуется.</div>';return '<div class="schema-tip">'+esc(body.description||'')+' '+(body.required?'<span class="required">Обязательное тело</span>':'')+'</div>'+Object.entries(body.content||{}).map(([mime,c])=>'<div class="schema-tip"><code>'+esc(mime)+'</code></div>'+schemaTable(c.schema)).join('')}
function responseItem(status, resp){const r=deref(resp);const success=Number(status)<400;let content=Object.entries(r?.content||{}).map(([mime,c])=>'<div class="schema-tip">Формат: <code>'+esc(mime)+'</code></div>'+schemaTable(c.schema)).join('');if(!content)content='<div class="schema-tip">Без тела ответа.</div>';return '<div class="response"><button class="respbtn" aria-expanded="false"><span class="status '+(success?'':'error')+'">'+esc(status)+'</span><span class="respdesc">'+esc(r?.description||'—')+'</span><span class="expand">＋</span></button><div class="respcontent" hidden>'+content+'</div></div>'}
function details(op){return '<section class="block"><h3 class="blocktitle">Параметры и заголовки</h3>'+parameters(op)+'</section><section class="block"><h3 class="blocktitle">Тело запроса</h3>'+requestBody(op)+'</section><section class="block"><h3 class="blocktitle">Ответы сервера</h3>'+Object.entries(op.responses||{}).map(([s,r])=>responseItem(s,r)).join('')+'</section>'}
function overview(){const total=(zone==='all'?opList:opList.filter(x=>x.zone===zone)).length;
return '<section class="hero"><div class="eyebrow">ZaryaWebsite · OpenAPI 3.1</div><h1>API-контракт <span class="accent">без сложного YAML</span></h1><p>Выбирай методы слева, смотри, какой запрос отправляет React, какие поля ожидает ASP.NET Core и какие ответы может вернуть сервер. Всё работает прямо из HTML-файла, без установки программ и без интернета.</p></section>'+ 
'<div class="callout"><strong>Статус: предложение для backend-разработчика.</strong> Это документация, а не работающий сервер. Методы и форматы JSON ещё требуют согласования с командой backend.</div>'+
'<div class="stats"><div class="stat"><div class="name">Зона 1 · Фундамент</div><div class="number">'+opList.filter(x=>x.zone==='foundation').length+'</div><div class="cap">Авторизация, сессии, 2FA, профиль, роли и владелец</div></div><div class="stat"><div class="name">Зона 2 · Основная</div><div class="number">'+opList.filter(x=>x.zone==='core').length+'</div><div class="cap">Пока только предварительный метод списка новостей</div></div><div class="stat"><div class="name">Зона 3 · Расширенная</div><div class="number">'+opList.filter(x=>x.zone==='extended').length+'</div><div class="cap">Зарезервирована для Мировой Машины, PressKit и CMS</div></div></div>'+
'<div class="introgrid"><div class="panel"><h3>Как читать API</h3><ul><li><strong>GET</strong> — получить данные</li><li><strong>POST</strong> — выполнить действие или создать запись</li><li><strong>PATCH/PUT</strong> — изменить данные</li><li><strong>DELETE</strong> — удалить или отменить</li></ul></div><div class="panel"><h3>С чего начать</h3><p>Пример взаимодействия: сайт получает CSRF-токен, выполняет вход и запрашивает состояние сессии. Если нужно, затем проверяет код 2FA.</p><button class="action" data-open="getSession">Посмотреть состояние сессии →</button></div></div>'+
'<div class="sectionline"></div><h2>Ключевые сценарии</h2><p>Быстрые переходы к важным операциям. Все остальные можно найти в меню слева или через строку поиска.</p><div class="flowcards"><button class="flowcard" data-open="login"><b>01 · Вход</b><small>POST /api/auth/login<br/>Пароль и состояния входа</small></button><button class="flowcard" data-open="getSession"><b>02 · Сессия</b><small>GET /api/auth/session<br/>Гость, email, 2FA, доступ</small></button><button class="flowcard" data-open="getNews"><b>03 · Новости</b><small>GET /api/news<br/>Существующий предварительный формат</small></button></div>';
}
function methodPage(o){const op=o.op;return '<section class="op-header"><span class="method '+esc(o.verb)+'">'+o.verb.toUpperCase()+'</span><div style="flex:1;min-width:240px"><div class="eyebrow">'+esc(tagNames[o.tag]||o.tag)+'</div><h1 style="font-size:clamp(27px,3vw,36px)">'+esc(op.summary||o.id)+'</h1></div></section>'+
'<div class="path"><span>'+esc(o.path)+'</span><button class="copy" id="copy-path">Скопировать</button></div><div class="meta"><span class="tag zone">Зона '+(o.zone==='foundation'?'1':o.zone==='core'?'2':'3')+' · '+esc(names[o.zone])+'</span><span class="tag">'+esc(o.id)+'</span><span class="tag source">Черновик API</span></div><p>'+esc(op.description||'Описание операции отсутствует')+'</p><div class="sectionline"></div>'+details(op)+'<div class="sectionline"></div><p style="font-size:12px">Описания полей и кодов показывают проектную спецификацию, а не результат запроса к серверу.</p><button class="action backbtn" id="back">← Вернуться к обзору</button>'}
function filtered(){return opList.filter(x=>(zone==='all'||x.zone===zone)&&(!search||[x.path,x.verb,x.op.summary,x.op.description,x.tag,tagNames[x.tag]||''].join(' ').toLowerCase().includes(search)))}
function navRender(){const ops=filtered();let out='<button class="navitem '+(active==='overview'?'selected':'')+'" data-open="overview"><span style="min-width:49px;text-align:center">⌂</span><span class="nvname">Обзор контракта</span></button>';
for(const tag of tagOrder){const items=ops.filter(x=>x.tag===tag);if(!items.length)continue;out+='<div class="navgroup">'+esc(tagNames[tag]||tag)+'<small>'+items.length+'</small></div>';out+=items.map(o=>'<button class="navitem '+(active===o.id?'selected':'')+'" data-open="'+esc(o.id)+'" title="'+esc(o.path)+'"><span class="method '+esc(o.verb)+'">'+o.verb.toUpperCase()+'</span><span class="nvname">'+esc(o.path)+'</span></button>').join('');}
if(!ops.length)out+='<div class="noresults">Нет методов по этому фильтру.</div>';$('#nav').innerHTML=out;
}
function openPage(id,changeHash=true){let o=opList.find(x=>x.id===id);if(!o && id!=='overview'){id='overview'}active=id;$('#main').innerHTML=id==='overview'?overview():methodPage(o);$('#crumb').textContent=id==='overview'?'Обзор контракта':o.verb.toUpperCase()+' '+o.path;navRender();$('#side').classList.remove('open');window.scrollTo({top:0,behavior:'instant'});if(changeHash)history.replaceState(null,'','#'+encodeURIComponent(id));}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-open]');if(tab){openPage(tab.dataset.open);return;}if(e.target.closest('#copy-path')){const o=opList.find(x=>x.id===active);if(o)navigator.clipboard?.writeText(o.verb.toUpperCase()+' '+o.path).then(()=>{e.target.textContent='Скопировано ✓';setTimeout(()=>{if(e.target.isConnected)e.target.textContent='Скопировать'},1500)}).catch(()=>{});return}if(e.target.closest('#back')){openPage('overview');return}if(e.target.closest('.respbtn')){const b=e.target.closest('.respbtn');const c=b.nextElementSibling;c.hidden=!c.hidden;b.setAttribute('aria-expanded',String(!c.hidden));b.querySelector('.expand').textContent=c.hidden?'＋':'−';return}});
$('#search').addEventListener('input',e=>{search=e.target.value.trim().toLowerCase();navRender()});$('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-zone]');if(!b)return;zone=b.dataset.zone;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('selected',x===b));navRender()});document.addEventListener('keydown',e=>{if(e.key==='/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#search').focus()}if(e.key==='Escape'){document.activeElement.blur();$('#side').classList.remove('open')}});$('#menu').addEventListener('click',()=>$('#side').classList.toggle('open'));
window.addEventListener('hashchange',()=>openPage(decodeURIComponent(location.hash.substring(1))||'overview',false));openPage(decodeURIComponent(location.hash.substring(1))||'overview',false);
</script>
</body></html>
