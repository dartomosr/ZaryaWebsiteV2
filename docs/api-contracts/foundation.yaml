openapi: 3.0.3
info:
  title: 'ZaryaWebsite API — Зона 1: фундамент'
  version: 0.1.0
  description: Предложение frontend-команды для согласования с backend ASP.NET Core. Функциональные требования
    утверждены пользователем; HTTP-маршруты, DTO и механизмы безопасности пока черновые. Нельзя считать
    реализацией.
servers:
- url: /
  description: Предпочтительно единый HTTPS origin через reverse proxy; фактические origins согласовать
tags:
- name: Auth
- name: Email
- name: TwoFactor
- name: Recovery
- name: OwnerRecovery
- name: Profile
- name: AdminUsers
- name: Owner
paths:
  /api/auth/csrf:
    get:
      tags:
      - Auth
      summary: Получить CSRF-токен
      operationId: getCsrfToken
      description: Выдаёт токен, связанный с текущим анонимным либо авторизованным сеансом. При отсутствии
        cookie создаёт безопасный анонимный сеанс. Ответ no-store.
      x-contract-zone: foundation
      security: []
      responses:
        '200':
          description: CSRF-токен
          headers:
            Cache-Control:
              description: Не сохранять ответ в браузерных или общих кешах.
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  token:
                    type: string
                    minLength: 1
                required:
                - token
        '429':
          $ref: ./shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ./shared/common.yaml#/components/responses/Error500
        '503':
          $ref: ./shared/common.yaml#/components/responses/Error503
      x-stability: proposed
  /api/auth/session:
    get:
      tags:
      - Auth
      summary: Получить текущее состояние сессии
      operationId: getSession
      description: Для гостя и действующей сессии возвращает 200; инфраструктурные ошибки и rate limit
        имеют отдельные статусы. state определяет доступ к операциям. Для anonymous user=null и все capabilities=false;
        для ограниченных состояний все capabilities=false. Состояние и роль пересчитываются сервером.
      x-contract-zone: foundation
      security: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/SessionSnapshot
          headers:
            Cache-Control:
              description: Не сохранять ответ в браузерных или общих кешах.
              schema:
                type: string
                enum:
                - no-store
        '429':
          $ref: ./shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ./shared/common.yaml#/components/responses/Error500
        '503':
          $ref: ./shared/common.yaml#/components/responses/Error503
      x-stability: proposed
  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Зарегистрировать обычный аккаунт
      operationId: register
      description: Не выполняет вход автоматически. При регистрации высылается служебное письмо; после
        входа возможен ограниченный режим до подтверждения email. Пользователь не может сам назначить
        роль.
      x-contract-zone: foundation
      security: []
      parameters:
      - $ref: ./shared/common.yaml#/components/parameters/CsrfHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./shared/common.yaml#/components/schemas/RegisterRequest
      responses:
        '201':
          description: Аккаунт создан, служебное письмо надёжно поставлено в очередь; доставка может завершиться
            позже.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/RegisterResult
          headers:
            Cache-Control:
              description: Не сохранять ответ в браузерных или общих кешах.
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: ./shared/common.yaml#/components/responses/Error400
        '409':
          $ref: ./shared/common.yaml#/components/responses/Error409
        '422':
          $ref: ./shared/common.yaml#/components/responses/Error422
        '429':
          $ref: ./shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ./shared/common.yaml#/components/responses/Error500
        '503':
          $ref: ./shared/common.yaml#/components/responses/Error503
        '403':
          $ref: ./shared/common.yaml#/components/responses/Error403
      x-stability: proposed
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Вход по email/уникальному username и паролю
      operationId: login
      description: 'Успешный ответ отражает итоговый этап: active / email_verification_required / two_factor_required
        / two_factor_setup_required. Пароль не означает прохождение 2FA. При смене идентификатора сессии
        клиент запрашивает новый CSRF-токен. Поле login принимает username либо email: при наличии @
        поиск выполняется только по email, иначе только по username без учёта регистра ASCII. displayName
        не используется для входа. При неподтверждённом email сохраняется email_verification_required.'
      x-contract-zone: foundation
      security: []
      parameters:
      - $ref: ./shared/common.yaml#/components/parameters/CsrfHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./shared/common.yaml#/components/schemas/LoginRequest
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/SessionSnapshot
          headers:
            Cache-Control:
              description: Не сохранять ответ в браузерных или общих кешах.
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: ./shared/common.yaml#/components/responses/Error400
        '401':
          $ref: ./shared/common.yaml#/components/responses/Error401
        '429':
          $ref: ./shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ./shared/common.yaml#/components/responses/Error500
        '503':
          $ref: ./shared/common.yaml#/components/responses/Error503
        '403':
          $ref: ./shared/common.yaml#/components/responses/Error403
      x-stability: proposed
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: Выйти из текущей сессии
      operationId: logout
      description: Сервер отзывает текущую сессию/предавторизационное состояние и сбрасывает cookie.
      x-contract-zone: foundation
      security: []
      parameters:
      - $ref: ./shared/common.yaml#/components/parameters/CsrfHeader
      responses:
        '204':
          description: Успешно
          headers:
            Cache-Control:
              description: Не сохранять ответ в браузерных или общих кешах.
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: ./shared/common.yaml#/components/responses/Error400
        '429':
          $ref: ./shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ./shared/common.yaml#/components/responses/Error500
        '403':
          $ref: ./shared/common.yaml#/components/responses/Error403
        '503':
          $ref: ./shared/common.yaml#/components/responses/Error503
      x-stability: proposed
  /api/auth/email/verify:
    post:
      tags:
      - Email
      summary: Подтвердить email одноразовым токеном
      operationId: verifyEmail
      description: Не создаёт полноценную сессию по email-токену; при действующей сессии состояние обновится
        при GET /api/auth/session. Подходит для первичного адреса и для подтверждения смены email.
      x-contract-zone: foundation
      security: []
      parameters:
      - $ref: ./shared/common.yaml#/components/parameters/CsrfHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./shared/common.yaml#/components/schemas/EmailTokenRequest
      responses:
        '204':
          description: Email подтверждён
          headers:
            Cache-Control:
              description: Не сохранять ответ в браузерных или общих кешах.
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: ./shared/common.yaml#/components/responses/Error400
        '409':
          $ref: ./shared/common.yaml#/components/responses/Error409
        '410':
          $ref: ./shared/common.yaml#/components/responses/Error410
        '429':
          $ref: ./shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ./shared/common.yaml#/components/responses/Error500
        '403':
          $ref: ./shared/common.yaml#/components/responses/Error403
        '503':
          $ref: ./shared/common.yaml#/components/responses/Error503
      x-stability: proposed
  /api/auth/email/resend:
    post:
      tags:
      - Email
      summary: Повторно отправить подтверждение адреса
      operationId: resendVerificationEmail
      description: Доступно только в режиме email_verification_required; применяется rate limit. Ответ
        не включает сам токен.
      x-contract-zone: foundation
      security:
      - SessionCookie: []
      x-required-auth-states:
      - email_verification_required
      parameters:
      - $ref: ./shared/common.yaml#/components/parameters/CsrfHeader
      responses:
        '202':
          description: Письмо поставлено в очередь
          headers:
            Cache-Control:
              description: Не сохранять ответ в браузерных или общих кешах.
              schema:
                type: string
                enum:
                - no-store
        '401':
          $ref: ./shared/common.yaml#/components/responses/Error401
        '403':
          $ref: ./shared/common.yaml#/components/responses/Error403
        '429':
          $ref: ./shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ./shared/common.yaml#/components/responses/Error500
        '503':
          $ref: ./shared/common.yaml#/components/responses/Error503
      x-stability: proposed
  /api/auth/email/unverified-address:
    post:
      tags:
      - Email
      summary: Исправить почту неподтверждённого аккаунта
      operationId: changeUnverifiedEmail
      description: Только ограниченный режим. Проверка пароля нужна, чтобы злоумышленник с временной сессией
        не подменил email.
      x-contract-zone: foundation
      security:
      - SessionCookie: []
      x-required-auth-states:
      - email_verification_required
      parameters:
      - $ref: ./shared/common.yaml#/components/parameters/CsrfHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./shared/common.yaml#/components/schemas/ChangeUnverifiedEmailRequest
      responses:
        '202':
          description: Новое подтверждение отправлено
          headers:
            Cache-Control:
              description: Не сохранять ответ в браузерных или общих кешах.
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: ./shared/common.yaml#/components/responses/Error400
        '401':
          $ref: ./shared/common.yaml#/components/responses/Error401
        '403':
          $ref: ./shared/common.yaml#/components/responses/Error403
        '409':
          $ref: ./shared/common.yaml#/components/responses/Error409
        '422':
          $ref: ./shared/common.yaml#/components/responses/Error422
        '429':
          $ref: ./shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ./shared/common.yaml#/components/responses/Error500
        '503':
          $ref: ./shared/common.yaml#/components/responses/Error503
      x-stability: proposed
  /api/auth/2fa/challenge:
    post:
      tags:
      - TwoFactor
      summary: Завершить вход одноразовым кодом
      operationId: confirmLoginSecondFactor
      description: Только состояние two_factor_required. Одноразовый резервный код погашается после успешного
        использования; успешный ответ активирует сессию.
      x-contract-zone: foundation
      security:
      - SessionCookie: []
      x-required-auth-states:
      - two_factor_required
      parameters:
      - $ref: ./shared/common.yaml#/components/parameters/CsrfHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./shared/common.yaml#/components/schemas/TwoFactorProof
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/SessionSnapshot
          headers:
            Cache-Control:
              description: Не сохранять ответ в браузерных или общих кешах.
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: ./shared/common.yaml#/components/responses/Error400
        '401':
          $ref: ./shared/common.yaml#/components/responses/Error401
        '403':
          $ref: ./shared/common.yaml#/components/responses/Error403
        '429':
          $ref: ./shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ./shared/common.yaml#/components/responses/Error500
        '503':
          $ref: ./shared/common.yaml#/components/responses/Error503
      x-stability: proposed
  /api/auth/2fa/setup:
    post:
      tags:
      - TwoFactor
      summary: Начать настройку TOTP
      operationId: startTwoFactorSetup
      description: 'Доступно пользователю в активном сеансе или сотруднику в two_factor_setup_required.
        Не включать фактор до успешного подтверждения. Секрет и otpauthUrl не сохраняются в логах. При
        уже включённой 2FA возвращает 409: setup не заменяет действующий фактор. Pending-секрет привязан
        к пользователю и текущему сеансу, имеет срок действия и не может подтвердиться из другой сессии.'
      x-contract-zone: foundation
      security:
      - SessionCookie: []
      x-required-auth-states:
      - active
      - two_factor_setup_required
      parameters:
      - $ref: ./shared/common.yaml#/components/parameters/CsrfHeader
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/TotpSetup
          headers:
            Cache-Control:
              description: Не сохранять ответ в браузерных или общих кешах.
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: ./shared/common.yaml#/components/responses/Error400
        '401':
          $ref: ./shared/common.yaml#/components/responses/Error401
        '403':
          $ref: ./shared/common.yaml#/components/responses/Error403
        '409':
          $ref: ./shared/common.yaml#/components/responses/Error409
        '429':
          $ref: ./shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ./shared/common.yaml#/components/responses/Error500
        '503':
          $ref: ./shared/common.yaml#/components/responses/Error503
      x-sensitive-response: true
      x-stability: proposed
  /api/auth/2fa/setup/confirm:
    post:
      tags:
      - TwoFactor
      summary: Подтвердить TOTP и получить резервные коды
      operationId: confirmTwoFactorSetup
      description: После успешной проверки TOTP система активирует 2FA и единожды показывает набор резервных
        кодов. После аварийного восстановления Owner в том же защищённом ответе выдаётся новый офлайн-ключ;
        только затем служебный доступ становится доступен. Погашение pending-секрета и включение фактора
        атомарны. Повтор после успеха даёт 409 и не возвращает старые секреты; потерянный ответ требует
        входа с TOTP и явной ротации кодов.
      x-contract-zone: foundation
      security:
      - SessionCookie: []
      x-required-auth-states:
      - active
      - two_factor_setup_required
      parameters:
      - $ref: ./shared/common.yaml#/components/parameters/CsrfHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./shared/common.yaml#/components/schemas/TotpConfirm
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/TwoFactorActivated
          headers:
            Cache-Control:
              description: Не сохранять ответ в браузерных или общих кешах.
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: ./shared/common.yaml#/components/responses/Error400
        '401':
          $ref: ./shared/common.yaml#/components/responses/Error401
        '403':
          $ref: ./shared/common.yaml#/components/responses/Error403
        '409':
          $ref: ./shared/common.yaml#/components/responses/Error409
        '422':
          $ref: ./shared/common.yaml#/components/responses/Error422
        '429':
          $ref: ./shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ./shared/common.yaml#/components/responses/Error500
        '503':
          $ref: ./shared/common.yaml#/components/responses/Error503
      x-sensitive-response: true
      x-stability: proposed
  /api/auth/2fa/disable:
    post:
      tags:
      - TwoFactor
      summary: Отключить собственную 2FA (только обычный User)
      operationId: disableOwnTwoFactor
      description: Для owner/admin/moderator всегда 403. Нужны пароль и код текущего фактора.
      x-contract-zone: foundation
      security:
      - SessionCookie: []
      x-permitted-roles:
      - user
      x-required-auth-states:
      - active
      parameters:
      - $ref: ./shared/common.yaml#/components/parameters/CsrfHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./shared/common.yaml#/components/schemas/TwoFactorDisable
      responses:
        '204':
          description: Успешно
          headers:
            Cache-Control:
              description: Не сохранять ответ в браузерных или общих кешах.
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: ./shared/common.yaml#/components/responses/Error400
        '401':
          $ref: ./shared/common.yaml#/components/responses/Error401
        '403':
          $ref: ./shared/common.yaml#/components/responses/Error403
        '409':
          $ref: ./shared/common.yaml#/components/responses/Error409
        '429':
          $ref: ./shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ./shared/common.yaml#/components/responses/Error500
        '503':
          $ref: ./shared/common.yaml#/components/responses/Error503
      x-stability: proposed
  /api/auth/2fa/recovery-codes/rotate:
    post:
      tags:
      - TwoFactor
      summary: Заменить резервные коды 2FA
      operationId: rotateRecoveryCodes
      description: Инвалидируются все старые резервные коды. Новый набор возвращается только один раз.
      x-contract-zone: foundation
      security:
      - SessionCookie: []
      x-required-auth-states:
      - active
      parameters:
      - $ref: ./shared/common.yaml#/components/parameters/CsrfHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./shared/common.yaml#/components/schemas/TwoFactorRotateCodes
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/RecoveryCodesResult
          headers:
            Cache-Control:
              description: Не сохранять ответ в браузерных или общих кешах.
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: ./shared/common.yaml#/components/responses/Error400
        '401':
          $ref: ./shared/common.yaml#/components/responses/Error401
        '403':
          $ref: ./shared/common.yaml#/components/responses/Error403
        '409':
          $ref: ./shared/common.yaml#/components/responses/Error409
        '429':
          $ref: ./shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ./shared/common.yaml#/components/responses/Error500
        '503':
          $ref: ./shared/common.yaml#/components/responses/Error503
      x-sensitive-response: true
      x-stability: proposed
  /api/auth/2fa/assisted-recovery/complete:
    post:
      tags:
      - TwoFactor
      summary: Завершить одобренное восстановление 2FA
      operationId: completeAssistedRecovery
      description: Требуется одноразовый токен из письма, инициированного администрацией. Для персонала
        после завершения нет служебного доступа до настройки нового TOTP. Обычному пользователю фактор
        может быть сброшен. Погашение токена, отзыв всех прежних сессий, pending-настроек и recovery-кодов
        атомарны. Токен не создаёт новую активную сессию; далее обычный вход. Повторная проверка роли
        исключает сброс Owner.
      x-contract-zone: foundation
      security: []
      parameters:
      - $ref: ./shared/common.yaml#/components/parameters/CsrfHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./shared/common.yaml#/components/schemas/AssistedTwoFactorComplete
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/AssistedTwoFactorResult
          headers:
            Cache-Control:
              description: Не сохранять ответ в браузерных или общих кешах.
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: ./shared/common.yaml#/components/responses/Error400
        '403':
          $ref: ./shared/common.yaml#/components/responses/Error403
        '410':
          $ref: ./shared/common.yaml#/components/responses/Error410
        '429':
          $ref: ./shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ./shared/common.yaml#/components/responses/Error500
        '503':
          $ref: ./shared/common.yaml#/components/responses/Error503
      x-stability: proposed
  /api/auth/password-recovery/complete:
    post:
      tags:
      - Recovery
      summary: Установить пароль по одноразовой ссылке
      operationId: completePasswordRecovery
      description: Ссылка отправляется только после ручного инициирования Admin/Owner. Успешная смена
        пароля не отключает 2FA и не создаёт автоматически действующую сессию. В одной транзакции погашаются
        токен и все прежние сессии/незавершённые recovery-токены аккаунта. Повтор погашенного токена даёт
        410.
      x-contract-zone: foundation
      security: []
      parameters:
