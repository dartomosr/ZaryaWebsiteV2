          - type: object
            nullable: true
            enum:
            - null
      required:
      - mode
      - scheduledAt
      description: Для mode=schedule required scheduledAt строго в будущем; mode=now uses null. Повторная
        правка опубликованного материала выходит только по явному publish.
      oneOf:
      - properties:
          mode:
            enum:
            - now
          scheduledAt:
            type: object
            nullable: true
            enum:
            - null
      - properties:
          mode:
            enum:
            - schedule
          scheduledAt:
            type: string
            format: date-time
