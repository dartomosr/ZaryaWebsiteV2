        во временном хранилище с очисткой после сбоя. Публикация сохраняет прежние значения до успешного
        commit; история опубликованных версий для этих типов не создаётся. Idempotency-Key ограничен инициатором
        и operationId, связан с каноническим телом. Сначала повторно проверить аутентификацию/права, затем
        искать результат: успешный повтор возвращает исходный результат без повторной проверки уже изменившихся
        версий. Одновременный незавершённый запрос с тем же ключом даёт 409 IDEMPOTENCY_IN_PROGRESS; другое
        тело даёт 409 IDEMPOTENCY_KEY_REUSED. Запись результата и commit публикации атомарны; срок хранения
        ключа согласовать до внедрения.'
      x-contract-zone: extended
      x-stability: proposed
      security:
      - SessionCookie: []
      x-permitted-roles:
      - admin
      - owner
      x-required-auth-states:
      - active
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Уникальный ключ запроса. Повтор с тем же телом возвращает прежний результат; с другим
          телом 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationBatchRequest'
      responses:
        '200':
          description: Все выбранные элементы опубликованы одновременно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationBatchResult'
          headers:
            Cache-Control:
              description: Не сохранять ответ в браузерных или общих кешах.
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '422':
          $ref: '#/components/responses/Error422'
  /api/presskit/archive/{snapshotId}:
    get:
      tags:
      - PressKitArchive
      operationId: downloadPressKitArchive
      summary: Скачать ZIP конкретной опубликованной версии PressKit
      description: Публичный PressKitPublic.zipUrl должен указывать на этот URL и закреплённый snapshotId.
        Не отдавать черновики. Архив сформирован и закреплён до публикации новой версии PressKit; содержимое
        URL неизменно, даже если позже опубликована следующая версия. 404 для неизвестных/неопубликованных
        снимков.
      x-contract-zone: extended
      x-stability: proposed
      security: []
      parameters:
      - name: snapshotId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: Скачиваемый ZIP опубликованного снимка PressKit
          content:
            application/zip:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: attachment; filename="Zarya-PressKit.zip"
              schema:
                type: string
            ETag:
              description: ETag неизменяемого ZIP-снимка
              schema:
                type: string
            Cache-Control:
              description: Разрешён долгий кеш для URL с неизменяемым snapshotId.
              schema:
                type: string
            Content-Length:
              description: Размер ZIP в байтах, если известен серверу
              schema:
                type: integer
                minimum: 0
        '400':
          $ref: '#/components/responses/Error400'
        '404':
