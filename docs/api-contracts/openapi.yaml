          minLength: 1
          maxLength: 300
        bodyMarkdown:
          type: string
          minLength: 1
          maxLength: 50000
      required:
      - title
      - bodyMarkdown
      description: Только редактируемые текстовые поля уже существующего элемента. Программные координаты,
        граф, связи, пространство и эффекты не передаются и не меняются.
    WorldMachineTextDraft:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 300
        bodyMarkdown:
          type: string
          maxLength: 50000
      description: Черновик может быть неполным. Публикация требует оба непустых поля title и bodyMarkdown
        согласно WorldMachineTextContent; превью допускает отсутствие полей.
    WorldMachineTextItem:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 128
        title:
          type: string
          minLength: 1
          maxLength: 300
        bodyMarkdown:
          type: string
          minLength: 1
          maxLength: 50000
      required:
      - key
      - title
      - bodyMarkdown
    WorldMachineTextBundle:
      type: object
      additionalProperties: false
      properties:
        contentGeneration:
          type: string
          minLength: 1
          maxLength: 128
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorldMachineTextItem'
          uniqueItems: true
      required:
      - contentGeneration
      - items
      description: Снимок всего опубликованного текстового наполнения для фронтенда при входе. Без карты/координат/структуры.
        Ключи регистрирует frontend-разработка, не CMS. Ключи key уникальны во всём items; uniqueItems
        проверяет только полные объекты, поэтому уникальность key проверяется сервером.
    WorldMachineCmsEntry:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 128
        editVersion:
          type: integer
          minimum: 1
        published:
          $ref: '#/components/schemas/WorldMachineTextContent'
        draft:
          $ref: '#/components/schemas/WorldMachineTextDraft'
      required:
      - key
      - editVersion
      description: published/draft опускаются при отсутствии. Никаких операций create/delete для ключа.
    WorldMachineCmsList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorldMachineCmsEntry'
          uniqueItems: true
      required:
      - items
      description: ' Ключи key уникальны во всём items; uniqueItems проверяет только полные объекты, поэтому
        уникальность key проверяется сервером.'
    PublicationBatchItem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - worldMachineText
          - faqItem
          - faqOrder
          - presskit
          - gameSummary
        resourceKey:
          type: string
          minLength: 1
          maxLength: 128
        expectedEditVersion:
          type: integer
          minimum: 1
      required:
      - type
      - resourceKey
      - expectedEditVersion
      description: 'resourceKey: ключ текста для worldMachineText, id вопроса для faqItem; для одиночных
        ресурсов строго faq-order, presskit или game-summary. FAQ delete предварительно ставится в черновик
        соответствующим методом core.'
      oneOf:
      - properties:
          type:
            enum:
            - worldMachineText
            - faqItem
      - properties:
          type:
            enum:
            - faqOrder
          resourceKey:
            enum:
            - faq-order
      - properties:
          type:
            enum:
            - presskit
          resourceKey:
            enum:
            - presskit
      - properties:
          type:
            enum:
            - gameSummary
          resourceKey:
            enum:
            - game-summary
    PublicationBatchRequest:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PublicationBatchItem'
          uniqueItems: true
      required:
      - items
      description: В одном запросе нельзя повторять (type,resourceKey). Публикация атомарна для всех элементов;
        в каждом должен существовать подготовленный черновик.
    PublicationBatchCheck:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - worldMachineText
          - faqItem
          - faqOrder
          - presskit
          - gameSummary
        resourceKey:
          type: string
          minLength: 1
          maxLength: 128
        ready:
          type: boolean
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                minLength: 1
                maxLength: 80
              message:
                type: string
              fieldPath:
                type: string
            required:
            - code
            - message
      required:
      - type
      - resourceKey
      - ready
      - issues
    PublicationBatchValidation:
      type: object
      additionalProperties: false
      properties:
        canPublish:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicationBatchCheck'
      required:
      - canPublish
      - items
      description: Результат проверки в данный момент. Между validate и publish возможны конкурентные
        изменения, publish повторно проверяет версии.
    PublicationBatchPublishedItem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - worldMachineText
          - faqItem
          - faqOrder
          - presskit
          - gameSummary
        resourceKey:
          type: string
          minLength: 1
          maxLength: 128
        newEditVersion:
          type: integer
          minimum: 1
      required:
      - type
      - resourceKey
      - newEditVersion
    PublicationBatchResult:
      type: object
      additionalProperties: false
      properties:
        batchId:
          type: string
          minLength: 1
          maxLength: 128
        publishedAt:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PublicationBatchPublishedItem'
      required:
      - batchId
      - publishedAt
      - items
      description: batchId — идентификатор операции для диагностики, не история опубликованных версий
        информационных материалов.
    PressKitArchiveItem:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 260
        fileName:
          type: string
          minLength: 1
          maxLength: 260
        mediaId:
          type: string
          minLength: 1
          maxLength: 128
        mimeType:
          type: string
          minLength: 1
          maxLength: 120
        sizeBytes:
          type: integer
          minimum: 0
      required:
      - path
      - fileName
      - mediaId
      - mimeType
      - sizeBytes
      description: 'Файл из выбранного снимка: preview-manifest использует черновик, публичный ZIP только
        опубликованный снимок. path относительный, без .., корня, диска, обратных слешей и повторов. Внешние
        URL не скачиваются сервером.'
    PressKitDraftArchiveManifest:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PressKitArchiveItem'
        externalLinks:
          type: array
          items:
            type: string
            format: uri
        warnings:
          type: array
          items:
            type: string
        canBuild:
          type: boolean
      required:
      - items
      - externalLinks
      - warnings
      - canBuild
      description: Только анализ материалов подготовленного черновика для редактора; не ссылка на публичный
        ZIP. Загрузка/архивация не выполняется в этой операции.
    FieldChange:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 160
        kind:
          type: string
          enum:
          - added
          - removed
          - modified
        before:
          type: string
          nullable: true
        after:
          type: string
          nullable: true
      required:
      - path
      - kind
      - before
      - after
      description: Для листовых текстовых/медиа-id полей; path например title или sections.fixes. null
        означает отсутствие поля, а не пустую строку.
    ContentRevisionDiff:
      type: object
      additionalProperties: false
      properties:
        resourceType:
          type: string
          enum:
          - news
          - update
        resourceId:
          type: string
          minLength: 1
          maxLength: 128
        fromRevisionId:
          type: string
          minLength: 1
          maxLength: 128
        toRevisionId:
          type: string
          minLength: 1
          maxLength: 128
        changes:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
      required:
      - resourceType
      - resourceId
      - fromRevisionId
      - toRevisionId
      - changes
      description: Семантические изменения содержательных полей между двумя сохранёнными редакциями; не
        затрагиваются автор, исходная дата, комментарии и реакции. Внутреннее хранение остаётся дельта-историей.
    WorldMachinePreviewItem:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 128
        title:
          type: string
          maxLength: 300
        bodyMarkdown:
          type: string
          maxLength: 50000
      required:
      - key
      description: 'Эффективный текст для превью: опубликованные поля с наложением черновика; отсутствующие
        поля первого черновика остаются отсутствующими, пустые строки сохраняются.'
    WorldMachinePreviewBundle:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorldMachinePreviewItem'
      required:
      - items
      description: Непубличное превью, уникальный key каждого элемента; публичное contentGeneration здесь
        неприменимо.
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Токен текущей анонимной/авторизованной сессии из GET /api/auth/csrf; клиент обновляет
        после смены сессии.
      schema:
        type: string
        minLength: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
