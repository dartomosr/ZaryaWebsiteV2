components:
  schemas:
    NewsContent:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          type: string
          minLength: 1
          maxLength: 1000
        bodyMarkdown:
          type: string
          minLength: 1
          maxLength: 100000
        coverMediaId:
          oneOf:
          - type: string
            minLength: 1
          - type: object
            nullable: true
            enum:
            - null
      required:
      - title
      - summary
      - bodyMarkdown
      - coverMediaId
      description: Содержательные поля; Markdown очищается сервером при отображении, mediaId только из
        медиатеки.
    NewsAdminRecord:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        status:
          $ref: ./shared.yaml#/components/schemas/ContentStatus
        draft:
          oneOf:
          - $ref: '#/components/schemas/NewsDraftContent'
          - type: object
            nullable: true
            enum:
            - null
        published:
          oneOf:
          - $ref: ./news.yaml#/components/schemas/PublishedNews
          - type: object
            nullable: true
            enum:
            - null
        scheduledAt:
          oneOf:
          - type: string
            format: date-time
          - type: object
            nullable: true
            enum:
            - null
        editVersion:
          type: integer
          minimum: 1
        commentsEnabled:
          type: boolean
      required:
      - id
      - status
      - draft
      - published
      - scheduledAt
      - editVersion
      - commentsEnabled
      description: В статусе published опубликованная версия может существовать одновременно с draft.
        Если публикация снята или в корзине, public GET скрывает её.
    AdminNewsPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NewsAdminRecord'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
        nextPage:
          type: integer
          minimum: 1
          nullable: true
      required:
      - items
      - page
      - pageSize
      - nextPage
    NewsRevision:
      type: object
      additionalProperties: false
      properties:
        revision:
          $ref: ./shared.yaml#/components/schemas/RevisionSummary
        content:
          $ref: '#/components/schemas/NewsContent'
      required:
      - revision
      - content
    NewsDraftContent:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 1000
        bodyMarkdown:
          type: string
          maxLength: 100000
        coverMediaId:
          oneOf:
          - type: string
            minLength: 1
          - type: object
            nullable: true
            enum:
            - null
      description: Неполный рабочий черновик разрешён; при публикации сервер проверяет обязательные поля
        опубликованной версии.
x-contract-zone: core
x-stability: proposed
