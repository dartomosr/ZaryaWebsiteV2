components:
  schemas:
    UpdateContent:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          type: string
          minLength: 1
          maxLength: 1000
        releaseDate:
          oneOf:
          - type: string
            format: date
          - type: object
            nullable: true
            enum:
            - null
        sections:
          $ref: ./updates.yaml#/components/schemas/UpdateSections
        coverMediaId:
          oneOf:
          - type: string
            minLength: 1
          - type: object
            nullable: true
            enum:
            - null
      required:
      - version
      - title
      - summary
      - releaseDate
      - sections
      - coverMediaId
      description: Релиз игры releaseDate не равен серверной дате публикации. Разделов минимум один.
    UpdateAdminRecord:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        status:
          $ref: ./shared.yaml#/components/schemas/ContentStatus
        draft:
          oneOf:
          - $ref: '#/components/schemas/UpdateDraftContent'
          - type: object
            nullable: true
            enum:
            - null
        published:
          oneOf:
          - $ref: ./updates.yaml#/components/schemas/PublishedUpdate
          - type: object
            nullable: true
            enum:
            - null
        scheduledAt:
          oneOf:
          - type: string
            format: date-time
          - type: object
            nullable: true
            enum:
            - null
        editVersion:
          type: integer
          minimum: 1
        commentsEnabled:
          type: boolean
      required:
      - id
      - status
      - draft
      - published
      - scheduledAt
      - editVersion
      - commentsEnabled
    AdminUpdatesPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpdateAdminRecord'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
        nextPage:
          type: integer
          minimum: 1
          nullable: true
      required:
      - items
      - page
      - pageSize
      - nextPage
    UpdateRevision:
      type: object
      additionalProperties: false
      properties:
        revision:
          $ref: ./shared.yaml#/components/schemas/RevisionSummary
        content:
          $ref: '#/components/schemas/UpdateContent'
      required:
      - revision
      - content
    UpdateSectionsDraft:
      type: object
      additionalProperties: false
      properties:
        newFeatures:
          type: string
          maxLength: 30000
        changes:
          type: string
          maxLength: 30000
        fixes:
          type: string
          maxLength: 30000
        balance:
          type: string
          maxLength: 30000
      description: Неполный рабочий черновик разрешён; при публикации сервер проверяет обязательные поля
        опубликованной версии.
      x-display-order:
      - newFeatures
      - changes
      - fixes
      - balance
    UpdateDraftContent:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          maxLength: 80
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 1000
        releaseDate:
          oneOf:
          - type: string
            format: date
          - type: object
            nullable: true
            enum:
            - null
        sections:
          $ref: '#/components/schemas/UpdateSectionsDraft'
        coverMediaId:
          oneOf:
          - type: string
            minLength: 1
          - type: object
            nullable: true
            enum:
            - null
      description: Неполный рабочий черновик разрешён; при публикации сервер проверяет обязательные поля
        опубликованной версии.
x-contract-zone: core
x-stability: proposed
