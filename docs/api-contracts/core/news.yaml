openapi: 3.0.3
info:
  title: 'ZaryaWebsite CORE: news'
  version: 0.2.0-proposed
paths:
  /api/news:
    get:
      tags:
      - News
      operationId: listPublicNews
      x-contract-zone: core
      summary: Список новостей с URL обложек
      description: 'Ответ — JSON-массив без обёртки пагинации. Параметры page и pageSize
        управляют выборкой, но не повторяются в ответе. coverUrl содержит URI-reference
        отдельного публичного запроса изображения; бинарное содержимое возвращается маршрутом
        GET /api/media/{mediaId}. Подробности: guides/NEWS_RESPONSE.md.'
      security: []
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/Page
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: Успешный ответ — JSON-массив элементов NewsResponse; пустая выборка возвращает пустой массив.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../shared/common.yaml#/components/schemas/NewsResponse
        '400':
          $ref: ../shared/common.yaml#/components/responses/Error400
        '429':
          $ref: ../shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ../shared/common.yaml#/components/responses/Error500
        '503':
          $ref: ../shared/common.yaml#/components/responses/Error503
      x-stability: proposed
  /api/news/{newsId}:
    get:
      tags:
      - News
      operationId: getPublicNews
      summary: Опубликованная новость
      x-contract-zone: core
      security: []
      parameters:
      - name: newsId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      description: Скрывает черновики, снятые, удалённые и ещё не наступившие запланированные публикации.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedNews'
        '400':
          $ref: ../shared/common.yaml#/components/responses/Error400
        '404':
          $ref: ../shared/common.yaml#/components/responses/Error404
        '429':
          $ref: ../shared/common.yaml#/components/responses/Error429
        '500':
          $ref: ../shared/common.yaml#/components/responses/Error500
        '503':
          $ref: ../shared/common.yaml#/components/responses/Error503
      x-stability: proposed
components:
  schemas:
    PublishedNews:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        bodyMarkdown:
          type: string
          minLength: 1
        coverUrl:
          oneOf:
          - type: string
            format: uri
          - type: object
            nullable: true
            enum:
            - null
        publishedAt:
          type: string
          format: date-time
        editedAt:
          oneOf:
          - type: string
            format: date-time
          - type: object
            nullable: true
            enum:
            - null
        commentsEnabled:
          type: boolean
      required:
      - id
      - title
      - summary
      - bodyMarkdown
      - coverUrl
      - publishedAt
      - editedAt
      - commentsEnabled
      description: Опубликованный снимок. Черновики и корзина гостю недоступны.
x-contract-zone: core
x-stability: proposed
